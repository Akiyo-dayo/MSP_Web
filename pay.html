<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>月弦阁 · 购买结算 | 深空联合补给处</title>
  <meta name="description" content="月弦阁扫码支付结算页" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/spacetrek.css" />
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="aurora-layer" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="topbar">
    <a href="./index.html" class="brand">
      <img class="brand-logo" src="./assets/img/spacetrek-logo.png" alt="" />
      <span>
        <span class="brand-cn">月弦阁</span>
        <small>SPACETREK RELAY</small>
      </span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="./guide.html">功能</a>
      <a href="./index.html#pricing">价格</a>
      <a href="#top" class="active">结算</a>
    </nav>
    <div class="topbar-actions">
      <a href="./index.html#pricing" class="btn btn-ghost btn-sm">← 返回价格</a>
      <button class="btn btn-ghost btn-sm side-drawer-trigger" type="button" aria-controls="site-drawer" aria-expanded="false">☰ 终端</button>
    </div>
  </header>

  <main class="pay-page" id="top">
    <div class="pay-card hud-panel">
      <p class="eyebrow">SUPPLY DEPOT<span class="cn">· 补给处</span></p>
      <h1 class="pay-card-title">支付结算</h1>
      <div class="pay-qrcode-box">
        <img src="./assets/img/zanshang.png" alt="付款二维码" loading="lazy" decoding="async" />
      </div>
      <p class="pay-remark-hint">⚠️ 付款时备注：版本 用户QQ号 群QQ号</p>
    </div>
  </main>

  <footer class="footer">
    © 2026 秋音Akiyo&F1y/Car · 月弦阁
    <span class="footer-en">SPACETREK COLLECTIVE · SUPPLY DEPOT</span>
  </footer>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="site-drawer" aria-hidden="true">
    <header class="drawer-head">
      <h3>🧭 快速导航</h3>
      <button class="drawer-close" id="close-drawer" type="button" aria-label="关闭边栏">✕</button>
    </header>
    <div class="drawer-quick-actions">
      <a class="btn btn-ghost" href="./index.html#pricing">← 返回价格</a>
      <a class="btn btn-ghost" href="./guide.html">📖 功能指南</a>
      <a class="btn btn-ghost" href="./board.html">💬 社区留言板</a>
      <a class="btn btn-ghost" href="./status.html">🔍 状态明细</a>
    </div>
  </aside>

  <script src="./assets/js/main.js"></script>
</body>
</html>
