<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>月弦阁 · Bot 状态 | 深空联合节点监测</title>
  <meta name="description" content="月弦阁 Bot 运行状态总览" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/spacetrek.css" />
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="aurora-layer" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="topbar">
    <a href="./index.html" class="brand">
      <img class="brand-logo" src="./assets/img/spacetrek-logo.png" alt="" />
      <span>
        <span class="brand-cn">月弦阁</span>
        <small>SPACETREK RELAY</small>
      </span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="./guide.html">功能</a>
      <a href="./index.html#pricing">价格</a>
      <a href="./board.html">留言</a>
      <a href="./status.html" class="active">状态</a>
    </nav>
    <div class="topbar-actions">
      <a href="./index.html" class="btn btn-ghost btn-sm">← 返回</a>
      <button class="btn btn-ghost btn-sm side-drawer-trigger" type="button" aria-controls="site-drawer" aria-expanded="false">☰ 终端</button>
    </div>
  </header>

  <main class="status-page">
    <section class="status-hero-panel hud-panel">
      <p class="eyebrow">NODE MONITOR<span class="cn">· 频率监测阵列</span></p>
      <h1>Bot 状态总览</h1>
      <p>基于实时数据生成，便于快速判断可用性与异常账号。</p>
      <div class="status-meta">
        <span class="meta-pill" id="network-mode">正在连接...</span>
        <span class="meta-pill" id="summary-total">总账号: --</span>
        <span class="meta-pill" id="summary-abnormal">异常: --</span>
        <a class="meta-pill" href="./admin.html" style="text-decoration:none;">⚙️ 管理终端 →</a>
      </div>
    </section>

    <section id="status-grid" class="status-grid">
      <div class="status-loading">⏳ 正在同步节点频率...</div>
    </section>
  </main>

  <footer class="footer">
    © 2026 秋音Akiyo&F1y/Car · 月弦阁
    <span class="footer-en">SPACETREK COLLECTIVE · NODE MONITOR</span>
  </footer>

  <button class="back-to-top" id="back-to-top" type="button" aria-label="返回顶部">↑</button>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="site-drawer" aria-hidden="true">
    <header class="drawer-head">
      <h3>🧭 快速导航</h3>
      <button class="drawer-close" id="close-drawer" type="button" aria-label="关闭边栏">✕</button>
    </header>
    <div class="drawer-quick-actions">
      <a class="btn btn-ghost" href="./index.html">🏠 返回首页</a>
      <a class="btn btn-ghost" href="./guide.html">📖 功能指南</a>
      <a class="btn btn-ghost" href="./board.html">💬 社区留言板</a>
      <a class="btn btn-ghost" href="./index.html#pricing">💳 价格方案</a>
    </div>
  </aside>

  <script>
    (function () {
      const networkModeEl = document.getElementById('network-mode');
      const totalEl = document.getElementById('summary-total');
      const abnormalEl = document.getElementById('summary-abnormal');
      const statusGrid = document.getElementById('status-grid');

      const isProd = window.location.hostname.includes('akiyo.fun');
      const API_URL = (isProd ? '/api/bot' : 'http://127.0.0.1:5001') + '/accounts';
      const LOCAL_AVATAR_FALLBACK = './assets/img/imgs/avatar-placeholder.svg';

      const DEMO_ACCOUNTS = [
        { name: '小千·主节点', qq_number: '10001', status: 'ok', region: 'astr', last_unban_date: '2026-05-20' },
        { name: '小千·二号机', qq_number: '10002', status: 'ok', region: 'astr', last_unban_date: '2026-06-30' },
        { name: '小千·三号机', qq_number: '10003', status: 'ok', region: 'astr', last_unban_date: '2026-07-10' },
        { name: '小千·NA镜像', qq_number: '10004', status: 'temp', region: 'na', unban_date: '2026-08-02', note: '演示' },
      ];

      function normalizeQQNumber(rawQQ) { return String(rawQQ ?? '').replace(/\D/g, ''); }
      function isValidQQNumber(q) { return /^\d{5,12}$/.test(q); }
      function getQQAvatarUrl(q) { return `https://q1.qlogo.cn/g?b=qq&nk=${q}&s=640`; }

      window.__statusAvatarFallback = function (img) {
        if (!img || img.dataset.fallbackApplied === '1') return;
        img.dataset.fallbackApplied = '1';
        img.src = LOCAL_AVATAR_FALLBACK;
      };

      function renderAvatar(name, rawQQ) {
        const q = normalizeQQNumber(rawQQ);
        const ok = isValidQQNumber(q);
        return `
          <div class="status-avatar-wrap" aria-hidden="true">
            <img class="status-avatar" src="${ok ? getQQAvatarUrl(q) : LOCAL_AVATAR_FALLBACK}"
                 alt="${name} 头像" loading="lazy" decoding="async" referrerpolicy="no-referrer"
                 onerror="window.__statusAvatarFallback(this)" />
          </div>`;
      }

      function escapeHtml(v) {
        return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function calculateStableTime(dateStr) {
        if (!dateStr) return '运行中';
        const start = new Date(dateStr);
        const diffMs = Date.now() - start;
        if (Number.isNaN(start.getTime()) || diffMs < 0) return '运行中';
        const days = Math.floor(diffMs / 86400000);
        const hours = Math.floor((diffMs % 86400000) / 3600000);
        return days > 0 ? `${days}天${hours}小时` : `${hours}小时`;
      }

      function normalizeRegion(v) {
        return String(v || '').trim().toLowerCase() === 'na' ? 'NA' : 'Astr';
      }

      function render(data, demo) {
        const abnormalCount = data.filter((i) => i.status !== 'ok').length;
        totalEl.textContent = `总账号: ${data.length}`;
        abnormalEl.textContent = `异常: ${abnormalCount}`;

        const demoNote = demo
          ? '<div class="status-loading" style="border-style: solid;">✦ 本地预览 · 演示数据（线上将同步真实节点状态）</div>'
          : '';

        statusGrid.innerHTML = demoNote + data.map((item) => {
          const safeName = escapeHtml(item.name || '未命名账号');
          const rawQQ = item.qq_number ?? item.qq ?? '-';
          const safeQQ = escapeHtml(rawQQ || '-');
          const region = normalizeRegion(item.region);
          const regionHtml = `<span class="region-tag ${region === 'NA' ? 'region-na' : 'region-astr'}">${region}</span>`;
          const avatarHtml = renderAvatar(safeName, rawQQ);
          const safeNote = item.note ? `<span class="note-tag">${escapeHtml(item.note)}</span>` : '';
          const head = (badge) => `
            <div class="status-full-head">
              <div class="status-head-left">${avatarHtml}
                <div class="status-full-name">${safeName}${regionHtml}${safeNote}</div>
              </div>${badge}
            </div>
            <div class="status-full-qq">QQ: ${safeQQ}</div>`;

          if (item.status === 'ok') {
            return `<article class="status-full-card hud-panel">${head('<span class="status-badge ok">✅ 运行正常</span>')}
              <div class="status-full-detail">🛡️ 稳定运行时长: ${escapeHtml(calculateStableTime(item.last_unban_date))}</div></article>`;
          }
          if (item.status === 'temp') {
            return `<article class="status-full-card hud-panel">${head('<span class="status-badge temp">⏳ 临时冻结</span>')}
              <div class="status-full-detail">📅 预计解封: ${escapeHtml(item.unban_date || '待更新')}</div></article>`;
          }
          if (item.status === 'offline') {
            return `<article class="status-full-card hud-panel">${head('<span class="status-badge offline">⚫ 离线</span>')}
              <div class="status-full-detail">当前账号处于离线维护状态</div>
              <a class="btn btn-ghost btn-sm status-login-link" href="https://bot.akiyo.fun/login" target="_blank" rel="noopener noreferrer">扫码登陆</a></article>`;
          }
          return `<article class="status-full-card hud-panel">${head('<span class="status-badge ban">🚫 永久封禁</span>')}
            <div class="status-full-detail">此账号已被永久停用</div></article>`;
        }).join('');
      }

      fetch(API_URL, { signal: AbortSignal.timeout(4500) })
        .then((r) => { if (!r.ok) throw new Error('bad'); return r.json(); })
        .then((data) => {
          networkModeEl.textContent = 'MODE: ONLINE';
          if (!Array.isArray(data) || data.length === 0) {
            totalEl.textContent = '总账号: 0';
            abnormalEl.textContent = '异常: 0';
            statusGrid.innerHTML = '<div class="status-empty">暂无账号数据</div>';
            return;
          }
          render(data, false);
        })
        .catch(() => {
          networkModeEl.textContent = 'MODE: LOCAL PREVIEW';
          render(DEMO_ACCOUNTS, true);
        });
    })();
  </script>
  <script src="./assets/js/main.js"></script>
</body>
</html>
