<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>月弦阁 · 社区留言板 | 深空联合通讯频段</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/spacetrek.css" />
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="aurora-layer" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="topbar">
    <a href="./index.html" class="brand">
      <img class="brand-logo" src="./assets/img/spacetrek-logo.png" alt="" />
      <span>
        <span class="brand-cn">月弦阁</span>
        <small>SPACETREK RELAY</small>
      </span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="./guide.html">功能</a>
      <a href="./index.html#pricing">价格</a>
      <a href="./board.html" class="active">留言</a>
      <a href="./status.html">状态</a>
    </nav>
    <div class="topbar-actions">
      <a href="./index.html" class="btn btn-ghost btn-sm">← 返回</a>
      <button class="btn btn-ghost btn-sm side-drawer-trigger" type="button" aria-controls="site-drawer" aria-expanded="false">☰ 终端</button>
    </div>
  </header>

  <main class="board-page">
    <header class="board-hero">
      <p class="eyebrow">COMM CHANNEL<span class="cn">· 通讯频段</span></p>
      <h2 class="board-title">💬 社区留言板</h2>
      <p class="board-subtitle">有什么想对我们说的吗？向中继站发送你的频率。</p>
    </header>

    <section class="composer-bar hud-panel" aria-label="留言发布区">
      <div id="login-box">
        <div class="composer-login-row">
          <input type="text" id="qq-input" class="board-input" placeholder="输入你的QQ号进行登录..." />
          <button class="btn btn-primary" id="login-button" type="button" onclick="login()">进入社区</button>
        </div>
      </div>
      <div id="post-box" class="composer-post" hidden>
        <div class="user-profile">
          <img id="my-avatar" class="msg-avatar" src="" alt="我的头像" />
          <span id="my-qq-display" class="user-qq"></span>
          <button class="btn btn-ghost btn-sm logout-btn" type="button" onclick="logout()">退出</button>
        </div>
        <textarea id="content-input" class="board-textarea" rows="3" placeholder="说点什么吧..."></textarea>
        <div class="composer-actions">
          <button class="btn btn-primary" type="button" onclick="submitMessage()">发送留言</button>
        </div>
      </div>
    </section>

    <section class="stream-zone" aria-label="留言列表区">
      <div id="messages-container">
        <div class="loading-text">⏳ 正在同步通讯记录...</div>
      </div>
    </section>
  </main>

  <footer class="footer">
    © 2026 秋音Akiyo&F1y/Car · 月弦阁
    <span class="footer-en">SPACETREK COLLECTIVE · COMM CHANNEL</span>
  </footer>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="site-drawer" aria-hidden="true">
    <header class="drawer-head">
      <h3>🧭 快速导航</h3>
      <button class="drawer-close" id="close-drawer" type="button" aria-label="关闭边栏">✕</button>
    </header>
    <div class="drawer-quick-actions">
      <a class="btn btn-ghost" href="./index.html">🏠 返回首页</a>
      <a class="btn btn-ghost" href="./guide.html">📖 功能指南</a>
      <a class="btn btn-ghost" href="./status.html">🖥️ 状态页</a>
      <a class="btn btn-ghost" href="./index.html#pricing">💳 价格方案</a>
    </div>
  </aside>

  <button class="back-to-top" id="back-to-top" type="button" aria-label="返回顶部">↑</button>

  <div id="cookie-banner" class="cookie-banner">
    <div><span>🍪 <b>Cookie 提示</b>：本社区使用基本 Cookie 以记住您的登录状态并提供顺畅的体验。继续浏览即表示您同意我们的使用规则。</span></div>
    <button class="cookie-btn" type="button" onclick="acceptCookies()">我知道了</button>
  </div>

  <script src="./assets/js/main.js"></script>
  <script>
    function setCookie(name, value, days) {
      const d = new Date();
      d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
      document.cookie = `${name}=${encodeURIComponent(value)};expires=${d.toUTCString()};path=/`;
    }
    function getCookie(name) {
      const target = name + '=';
      for (const c of document.cookie.split(';')) {
        const t = c.trim();
        if (t.indexOf(target) === 0) return decodeURIComponent(t.substring(target.length));
      }
      return null;
    }
    function eraseCookie(name) {
      document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/`;
    }

    const API_URL = window.location.hostname.includes('akiyo.fun')
      ? '/api/community/api/messages'
      : 'http://127.0.0.1:5002/api/messages';

    const DEMO_MESSAGES = [
      {
        qq: '10001', timestamp: '2026-07-28 21:14:05',
        content: '深空联合主题太帅了，开屏动画有3.0标题画面那味了 ✦',
        reply: '感谢支持！频率已收录进档案馆。', reply_timestamp: '2026-07-28 22:02:41'
      },
      {
        qq: '10002', timestamp: '2026-07-27 09:48:12',
        content: '体验版小千很稳定，鸣潮签到和面板查询都在用。'
      },
    ];

    let currentQQ = getCookie('community_qq') || '';

    function showComposerByState() {
      const loginBox = document.getElementById('login-box');
      const postBox = document.getElementById('post-box');
      if (currentQQ) {
        loginBox.hidden = true;
        postBox.hidden = false;
        document.getElementById('my-avatar').src = `https://q1.qlogo.cn/g?b=qq&nk=${currentQQ}&s=100`;
        document.getElementById('my-qq-display').innerText = currentQQ;
      } else {
        loginBox.hidden = false;
        postBox.hidden = true;
      }
    }

    function login() {
      const qq = document.getElementById('qq-input').value.trim();
      if (!/^\d{5,12}$/.test(qq)) return alert('请输入有效的QQ号');
      setCookie('community_qq', qq, 30);
      currentQQ = qq;
      showComposerByState();
    }

    function logout() {
      eraseCookie('community_qq');
      currentQQ = '';
      document.getElementById('qq-input').value = '';
      showComposerByState();
    }

    async function submitMessage() {
      const content = document.getElementById('content-input').value.trim();
      if (!content) return alert('内容不能为空');
      const btn = document.querySelector('#post-box .btn-primary');
      const origText = btn.innerText;
      try {
        btn.innerText = '发送中...';
        btn.disabled = true;
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ qq: currentQQ, content })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('content-input').value = '';
          fetchMessages();
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('本地预览模式：留言服务未连接，线上环境可正常发送');
      } finally {
        btn.innerText = origText;
        btn.disabled = false;
      }
    }

    function renderMessages(msgs, demo) {
      const container = document.getElementById('messages-container');
      if (!Array.isArray(msgs) || msgs.length === 0) {
        container.innerHTML = `
          <div class="empty-state-card hud-panel" style="padding: 34px;">
            <div class="empty-icon">💬</div>
            <div class="empty-title">暂无留言</div>
            <div class="empty-sub">成为第一个留下足迹的人吧</div>
          </div>`;
        return;
      }
      container.innerHTML =
        (demo ? `<div class="loading-text" style="padding: 8px 0 14px;">✦ 本地预览 · 演示数据（线上将同步真实留言）</div>` : '') +
        msgs.map((msg) => `
          <article class="msg-item hud-panel">
            <img class="msg-avatar" src="https://q1.qlogo.cn/g?b=qq&nk=${encodeURIComponent(msg.qq)}&s=100" onerror="this.src='./assets/img/imgs/avatar-placeholder.svg'" alt="用户头像" />
            <div class="msg-body">
              <div class="msg-head">
                <span class="msg-qq">${escapeHtml(msg.qq)}</span>
                <span class="msg-time">${escapeHtml(msg.timestamp)}</span>
              </div>
              <p class="msg-content">${escapeHtml(msg.content)}</p>
              ${msg.reply ? `
                <div class="reply-box">
                  <span class="reply-title">RE: ${escapeHtml(msg.reply_timestamp)}</span>
                  ${escapeHtml(msg.reply)}
                </div>` : ''}
            </div>
          </article>`).join('');
    }

    async function fetchMessages() {
      try {
        const res = await fetch(API_URL, { signal: AbortSignal.timeout(4500) });
        renderMessages(await res.json(), false);
      } catch (err) {
        renderMessages(DEMO_MESSAGES, true);
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    function checkCookieConsent() {
      if (!getCookie('cookie_consent_accepted')) {
        setTimeout(() => document.getElementById('cookie-banner').classList.add('show'), 500);
      }
    }
    function acceptCookies() {
      setCookie('cookie_consent_accepted', 'true', 365);
      document.getElementById('cookie-banner').classList.remove('show');
    }

    document.addEventListener('DOMContentLoaded', () => {
      showComposerByState();
      fetchMessages();
      checkCookieConsent();
    });
  </script>
</body>
</html>
